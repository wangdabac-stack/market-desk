name: 데이터 업데이트

on:
  # 평일 19:00 KST (= UTC 10:00) 자동 실행
  schedule:
    - cron: "0 10 * * 1-5"
  # Actions 탭에서 버튼으로 직접 실행할 수 있게 함
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests

      - name: 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_disclosure.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
          else
            git commit -m "데이터 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
