name: 데이터 업데이트

on:
  schedule:
    # 예약 실행은 서버 사정에 따라 5~20분 밀릴 수 있어 조금 앞당겨 잡음
    - cron: "50 6 * * 1-5"    # 15:50 KST — 1차, 마감 직후 속보
    - cron: "50 9 * * 1-5"    # 18:50 KST — 2차, 확정치 반영
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests pykrx pandas

      - name: 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_disclosure.py

      # 거래소 데이터가 실패해도 공시는 살아있도록 계속 진행
      - name: 거래소 데이터 수집
        continue-on-error: true
        run: python scripts/fetch_market.py

      - name: 변경분 커밋
        run: |
          KST_NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          KST_HOUR=$(TZ=Asia/Seoul date '+%H')
          if [ "$KST_HOUR" -lt 17 ]; then ROUND="1차(마감 직후)"; else ROUND="2차(확정치)"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없어 커밋을 건너뜁니다."
          else
            git commit -m "데이터 $ROUND 업데이트: $KST_NOW"
            git pull --rebase
            git push
          fi
